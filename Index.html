<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Visibility Checker</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        input, button { display: block; width: 100%; margin-bottom: 10px; padding: 10px; font-size: 16px; }
        button { background: #0070f3; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>AI Visibility Checker</h2>
    <form id="demoForm">
        <input type="text" id="brand_name" placeholder="Brand Name (e.g. Acme CRM)" required>
        <input type="text" id="industry" placeholder="Industry (e.g. CRM software)" required>
        <input type="text" id="competitors" placeholder="Competitors (comma separated, e.g. Salesforce, HubSpot)">
        <button type="submit">Check Visibility</button>
    </form>
    <div id="result">Results will appear here...</div>

    <script>
        document.getElementById('demoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = "Loading... Please wait (This can take 15-30 seconds).";

            const brand = document.getElementById('brand_name').value;
            const industry = document.getElementById('industry').value;
            const competitors = document.getElementById('competitors').value.split(',').map(c => c.trim()).filter(c => c);

            try {
                // Hum /api/demo call kar rahe hain jo automatically API key inject karegi
                const response = await fetch('/api/demo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ brand_name: brand, industry: industry, competitors: competitors })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerText = JSON.stringify(data, null, 2);
                } else {
                    resultDiv.innerText = "Error: " + (data.error || "Something went wrong");
                }
            } catch (error) {
                resultDiv.innerText = "Network Error: " + error.message;
            }
        });
    </script>
</body>
</html>
